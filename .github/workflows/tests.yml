name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build examples
        run: |
          python build.py examples/minimal --out /tmp/papier-abgleich-minimal
          python build.py examples/inkpartner-grillme --out /tmp/papier-abgleich-inkpartner --name inkpartner-fakten.html
